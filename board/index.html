<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Whiteboard (Aarav's side)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #1b1f23; color: #eee; display: flex; flex-direction: column; height: 100vh; }
  #toolbar { padding: 8px; display: flex; gap: 8px; align-items: center; background: #2a2f35; }
  #toolbar button { padding: 6px 14px; cursor: pointer; }
  #stage { flex: 1; display: flex; justify-content: center; align-items: center; min-height: 0; }
  #board { background: #fdfdf8; border-radius: 8px; max-width: 98%; max-height: 98%; }
  #caption { padding: 8px 12px; background: #2a2f35; min-height: 24px; font-size: 15px; }
  details { background: #2a2f35; padding: 6px 12px; }
  textarea { width: 100%; height: 160px; font-family: monospace; font-size: 12px; box-sizing: border-box; }
</style>
</head>
<body>
  <div id="toolbar">
    <button id="play">Play script</button>
    <button id="clear">Clear</button>
    <span id="status"></span>
  </div>
  <div id="stage">
    <svg id="board" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div id="caption"></div>
  <details>
    <summary>Script JSON (paste any script here to test)</summary>
    <textarea id="script"></textarea>
  </details>
  <script src="board.js"></script>
  <script>
    // Test page only. In the real app Kabir passes his own speak() into playScript().
    const ta = document.getElementById('script');
    const cap = document.getElementById('caption');
    const status = document.getElementById('status');

    fetch('../shared/example-pythagoras.json')
      .then(r => r.json())
      .then(j => { ta.value = JSON.stringify(j, null, 2); })
      .catch(() => {
        ta.value = '// Could not load ../shared/example-pythagoras.json from file://. Paste it here, or run: npx serve .. (then open /board/)';
      });

    // Fake speak(): browser voice stand-in. Resolves when speech ends.
    function fakeSpeak(text) {
      cap.textContent = text;
      return new Promise(resolve => {
        if (!('speechSynthesis' in window)) { setTimeout(resolve, Math.max(1500, text.length * 55)); return; }
        const u = new SpeechSynthesisUtterance(text);
        u.onend = resolve;
        u.onerror = resolve;
        speechSynthesis.cancel();
        speechSynthesis.speak(u);
      });
    }

    document.getElementById('play').onclick = async () => {
      let script;
      try { script = JSON.parse(ta.value); } catch (e) { status.textContent = 'Bad JSON: ' + e.message; return; }
      status.textContent = 'playing...';
      await window.board.playScript(script, fakeSpeak);
      status.textContent = 'done';
    };
    document.getElementById('clear').onclick = () => { window.board.clearBoard(); cap.textContent = ''; status.textContent = ''; };
  </script>
</body>
</html>
